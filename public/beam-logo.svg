<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beam logo">
  <defs>
    <linearGradient id="beamLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>
  <!-- Phone (left device) -->
  <rect x="8" y="14" width="16" height="36" rx="4.5" fill="url(#beamLogoGrad)"/>
  <rect x="11" y="18" width="10" height="28" rx="2" fill="#FFFFFF" fill-opacity="0.16"/>
  <!-- Laptop (right device) -->
  <rect x="40" y="16" width="16" height="24" rx="3" fill="url(#beamLogoGrad)"/>
  <rect x="43" y="19" width="10" height="18" rx="1.5" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="36" y="42" width="24" height="3.5" rx="1.75" fill="url(#beamLogoGrad)"/>
  <!-- Beam: concentric arcs passing between the two devices -->
  <g fill="none" stroke="url(#beamLogoGrad)" stroke-width="2.6" stroke-linecap="round">
    <path d="M 26 32 Q 32 23 38 32"/>
    <path d="M 24.5 32 Q 32 18.5 39.5 32" opacity="0.5"/>
  </g>
</svg>
